<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Aditya Nudurumati | Flutter Developer</title>
    <meta
      name="description"
      content="Aditya Nudurumati — Software Engineer building production Flutter applications for mobile, web, and TV, with a focus on real-time IoT monitoring."
    />
    <meta name="author" content="Aditya Nudurumati" />
    <link rel="canonical" href="https://www.adityanudurumati.com/" />

    <!-- Open Graph. The image must be PNG/JPEG — LinkedIn, WhatsApp, Slack and
         Facebook all silently drop SVG, which renders the card imageless. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aditya Nudurumati" />
    <meta property="og:title" content="Aditya Nudurumati | Flutter Developer" />
    <meta
      property="og:description"
      content="Software Engineer building production Flutter applications for mobile, web, and TV, with a focus on real-time IoT monitoring."
    />
    <meta property="og:url" content="https://www.adityanudurumati.com/" />
    <meta property="og:image" content="https://www.adityanudurumati.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aditya Nudurumati — Flutter Developer" />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aditya Nudurumati | Flutter Developer" />
    <meta
      name="twitter:description"
      content="Software Engineer building production Flutter applications for mobile, web, and TV, with a focus on real-time IoT monitoring."
    />
    <meta name="twitter:image" content="https://www.adityanudurumati.com/og-image.png" />
    <meta name="twitter:image:alt" content="Aditya Nudurumati — Flutter Developer" />

    <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG here and screenshots the page instead, so this must be a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Inter is self-hosted (see the @font-face in src/index.css). Preloading
         it starts the download alongside the CSS instead of after it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-wght-normal.woff2"
      crossorigin
    />

    <!--
      Two linked entities. The Person is the identity Google ties the domain
      to; the WebSite is what it reads to decide the site name shown above the
      result, instead of guessing from the bare domain.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
      {
        "@type": "WebSite",
        "@id": "https://www.adityanudurumati.com/#website",
        "name": "Aditya Nudurumati",
        "alternateName": "Aditya Nudurumati — Flutter Developer",
        "url": "https://www.adityanudurumati.com/",
        "inLanguage": "en",
        "publisher": { "@id": "https://www.adityanudurumati.com/#person" }
      },
      {
        "@type": "Person",
        "@id": "https://www.adityanudurumati.com/#person",
        "name": "Aditya Nudurumati",
        "jobTitle": "Software Engineer",
        "url": "https://www.adityanudurumati.com/",
        "image": "https://www.adityanudurumati.com/og-image.png",
        "email": "mailto:adithyanudurumati@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Hyderabad",
          "addressCountry": "IN"
        },
        "worksFor": {
          "@type": "Organization",
          "name": "AquaExchange Agri Tech Pvt Ltd"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Rajiv Gandhi University of Knowledge Technologies, Srikakulam (IIIT-AP)"
        },
        "knowsAbout": ["Flutter", "Dart", "Riverpod", "Firebase", "REST APIs"],
        "sameAs": [
          "https://www.linkedin.com/in/aditya-nudurumati-b936a316a/",
          "https://github.com/AdityaNudurumati"
        ]
      }
        ]
      }
    </script>

    <!-- Apply the stored theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
