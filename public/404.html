<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Aditya Nudurumati</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Deliberately standalone: Vercel serves this file for any unmatched path,
      so it must not depend on the hashed bundles or on a route resolving. All
      styling is inline and the tokens mirror src/index.css.
    -->
    <style>
      /* Repeated here rather than shared: this page must not depend on the
         hashed CSS bundle. Same file, so it is already cached in most cases. */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
      }

      :root {
        color-scheme: dark;
        --bg: #08090c;
        --surface: rgba(255, 255, 255, 0.026);
        --border: rgba(255, 255, 255, 0.09);
        --border-strong: rgba(255, 255, 255, 0.16);
        --text-strong: #f2f4f8;
        --text-muted: #8b93a4;
        --text-faint: #7b8496;
        --accent: #7d9bff;
        --accent-2: #9f86ff;
        --accent-soft: rgba(125, 155, 255, 0.13);
        --accent-line: rgba(125, 155, 255, 0.32);
        --on-accent: #070912;
        --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
          Roboto, Helvetica, Arial, sans-serif;
        --font-mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      }

      [data-theme='light'] {
        color-scheme: light;
        --bg: #fbfbfd;
        --surface: rgba(15, 20, 35, 0.022);
        --border: rgba(15, 20, 35, 0.11);
        --border-strong: rgba(15, 20, 35, 0.2);
        --text-strong: #10131b;
        --text-muted: #5c6373;
        --text-faint: #626a79;
        --accent: #3f5bd9;
        --accent-2: #6d4fd6;
        --accent-soft: rgba(63, 91, 217, 0.1);
        --accent-line: rgba(63, 91, 217, 0.28);
        --on-accent: #ffffff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
        background: var(--bg);
        color: var(--text-muted);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }

      .grid-bg {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 60px 60px;
        opacity: 0.5;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 20%, transparent 75%);
      }

      main {
        position: relative;
        text-align: center;
        max-width: 34rem;
      }

      .badge {
        display: inline-grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        margin-bottom: 2rem;
        border-radius: 12px;
        border: 1px solid var(--accent-line);
        background: var(--accent-soft);
        color: var(--accent);
        font-family: var(--font-mono);
        font-size: 1rem;
        font-weight: 600;
      }

      .code {
        margin: 0;
        font-family: var(--font-mono);
        font-size: clamp(3.5rem, 14vw, 5.5rem);
        font-weight: 600;
        letter-spacing: -0.04em;
        line-height: 1;
        background: linear-gradient(100deg, var(--text-strong) 25%, var(--accent) 70%, var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h1 {
        margin: 1.15rem 0 0.65rem;
        font-size: clamp(1.25rem, 3.4vw, 1.6rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        color: var(--text-strong);
      }

      p {
        margin: 0 auto;
        max-width: 30rem;
        font-size: 1rem;
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        justify-content: center;
        margin-top: 2.25rem;
      }

      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.7rem 1.25rem;
        border-radius: 999px;
        border: 1px solid transparent;
        font-size: 0.925rem;
        font-weight: 500;
        text-decoration: none;
        transition: transform 140ms cubic-bezier(0.22, 1, 0.36, 1), background 140ms, border-color 140ms;
      }

      a.btn--primary {
        background: var(--accent);
        color: var(--on-accent);
      }

      a.btn--secondary {
        background: var(--surface);
        border-color: var(--border-strong);
        color: var(--text-strong);
      }

      a.btn:hover { transform: translateY(-1px); }
      a.btn--secondary:hover { background: var(--accent-soft); border-color: var(--accent-line); }

      a.btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .path {
        margin-top: 2.5rem;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--text-faint);
        word-break: break-all;
      }

      @media (prefers-reduced-motion: reduce) {
        a.btn { transition: none; }
        a.btn:hover { transform: none; }
      }
    </style>

    <!-- Match the theme the visitor already chose on the main site. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div class="grid-bg" aria-hidden="true"></div>

    <main>
      <div class="badge" aria-hidden="true">AN</div>

      <p class="code" aria-hidden="true">404</p>
      <h1>This page doesn&rsquo;t exist</h1>
      <p>
        The link may be out of date, or the address might have a typo. Everything
        on the site is reachable from the home page.
      </p>

      <div class="actions">
        <a class="btn btn--primary" href="/">Go to the home page</a>
        <a class="btn btn--secondary" href="/notes/">Browse the notes</a>
      </div>

      <p class="path" id="requested-path"></p>
    </main>

    <script>
      // Echo the failed path so a mistyped or truncated URL is obvious.
      (function () {
        var el = document.getElementById('requested-path');
        if (el) el.textContent = location.pathname;
      })();
    </script>
  </body>
</html>
