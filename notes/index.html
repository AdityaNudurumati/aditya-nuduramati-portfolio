<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Notes | Aditya Nudurumati</title>
    <meta
      name="description"
      content="Long-form study notes by Aditya Nudurumati — a full Flutter and Dart track covering the language, architecture, performance, testing and delivery, published as free PDFs."
    />
    <meta name="author" content="Aditya Nudurumati" />
    <link rel="canonical" href="https://www.adityanudurumati.com/notes/" />

    <!-- Open Graph. The image must be PNG/JPEG — LinkedIn, WhatsApp, Slack and
         Facebook all silently drop SVG, which renders the card imageless. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aditya Nudurumati" />
    <meta property="og:title" content="Notes | Aditya Nudurumati" />
    <meta
      property="og:description"
      content="Long-form study notes on Flutter and Dart — the language, architecture, performance, testing and delivery — published as free PDFs."
    />
    <meta property="og:url" content="https://www.adityanudurumati.com/notes/" />
    <meta property="og:image" content="https://www.adityanudurumati.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aditya Nudurumati — Flutter Developer" />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Notes | Aditya Nudurumati" />
    <meta
      name="twitter:description"
      content="Long-form study notes on Flutter and Dart, published as free PDFs."
    />
    <meta name="twitter:image" content="https://www.adityanudurumati.com/og-image.png" />
    <meta name="twitter:image:alt" content="Aditya Nudurumati — Flutter Developer" />

    <meta name="theme-color" content="#08090c" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG here and screenshots the page instead, so this must be a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Inter is self-hosted (see the @font-face in src/index.css). Preloading
         it starts the download alongside the CSS instead of after it. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-wght-normal.woff2"
      crossorigin
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Notes",
        "description": "Long-form study notes published as PDF documents.",
        "url": "https://www.adityanudurumati.com/notes/",
        "isPartOf": {
          "@type": "WebSite",
          "name": "Aditya Nudurumati",
          "url": "https://www.adityanudurumati.com/"
        },
        "author": {
          "@type": "Person",
          "name": "Aditya Nudurumati",
          "url": "https://www.adityanudurumati.com/"
        }
      }
    </script>

    <!-- Apply the stored theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/notes.jsx"></script>
  </body>
</html>
